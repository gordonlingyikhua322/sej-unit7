let currentScore = 0;
const answeredQuestions = new Set();

function renderQuiz() {
  const container = document.getElementById('quizForm');
  let currentSec = "";

  questionsData.forEach((qItem, idx) => {
    if (qItem.section !== currentSec) {
      currentSec = qItem.section;
      const secHeader = document.createElement('div');
      secHeader.className = 'section-title';
      secHeader.innerText = currentSec;
      container.appendChild(secHeader);
    }

    const card = document.createElement('div');
    card.className = 'quiz-card';
    card.id = `q-card-${idx}`;

    const numSpan = document.createElement('span');
    numSpan.className = 'question-number';
    numSpan.innerText = `Soalan ${qItem.num}`;

    const qText = document.createElement('div');
    qText.className = 'question-text';
    qText.innerText = qItem.q;

    const optGrid = document.createElement('div');
    optGrid.className = 'options-grid';

    const feedback = document.createElement('div');
    feedback.className = 'feedback';
    feedback.id = `fb-${idx}`;

    qItem.options.forEach((optStr, optIdx) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'option-btn';
      btn.innerText = optStr;
      btn.onclick = () => checkAnswer(idx, optIdx, qItem.ans);
      optGrid.appendChild(btn);
    });

    card.appendChild(numSpan);
    card.appendChild(qText);
    card.appendChild(optGrid);
    card.appendChild(feedback);
    container.appendChild(card);
  });
}

function checkAnswer(qIdx, selectedIdx, correctIdx) {
  if (answeredQuestions.has(qIdx)) return;
  answeredQuestions.add(qIdx);

  const card = document.getElementById(`q-card-${qIdx}`);
  const buttons = card.querySelectorAll('.option-btn');
  const feedback = document.getElementById(`fb-${qIdx}`);

  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === correctIdx) {
      btn.classList.add('correct');
    }
    if (i === selectedIdx && i !== correctIdx) {
      btn.classList.add('wrong');
    }
  });

  if (selectedIdx === correctIdx) {
    currentScore++;
    document.getElementById('score').innerText = currentScore;
    feedback.innerText = "Syabas! Jawapan anda BETUL.";
    feedback.className = "feedback correct";
  } else {
    feedback.innerText = `Jawapan anda SALAH. Jawapan betul ialah: ${questionsData[qIdx].options[correctIdx]}`;
    feedback.className = "feedback wrong";
  }
}

window.onload = renderQuiz;
